# Project tasks. Python format/lint/test tasks live in python_tasks.toml.

[bootstrap]
description = "Set up a fresh clone: dependencies, commit hooks, database, vendored files"
run = [
    "poetry install",
    "hk install --mise",
    "django-admin migrate",
    "django-admin downloadvendor",
]

[dj]
description = "Run any django-admin subcommand against the dev settings"
run = "django-admin"

[start]
description = "Start the Django dev server on localhost:8020"
run = "django-admin runserver localhost:8020"

[update]
description = "Update all dependencies: mise tools, pip, Poetry packages"
run = [
    "mise upgrade --bump --exclude python --minimum-release-age=7d",
    "mise install",
    { task = "dep:upgrade:py" },
]

["lint:hk"]
description = "Run the hk linters that lint:py does not cover, on all files (file hygiene, templates)"
run = "hk check --all"

[check]
description = "Format, then lint (autofix where the tool can)"
run = [{ task = "format:py" }, { task = "lint:py" }, { task = "lint:hk" }]

[pr-fix]
description = "The absolute gate the rituals repair until green: format, lint, every test with coverage, diff coverage"
run = ["poetry install", { task = "check" }, { task = "test:py:cov:diff" }]

[fullcheck]
description = "The commit gate for people: pr-fix plus the debt budget, which needs judgement when it fails"
run = [{ task = "pr-fix" }, { task = "lint:tingle" }]
