[project]
name = "erudite"
version = "0.1.0"
description = "Local book manager: one library from Goodreads, e-book files and the shelf, ordered by goal, series and topic. Django, SQLite, zero Node."
authors = [{ name = "Radosław Ganczarek", email = "radoslaw@ganczarek.in" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.14.0,<3.15"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]
dynamic = ['dependencies']

[project.urls]
repository = "https://github.com/fancysnake/erudite"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "erudite", from = "src" }]
requires-poetry = ">=2.0,<3"

[tool.poetry.dependencies]
django = "~6.1.0"
django-environ = "^0.14.0"
django-unfold = "^0.110.0"
pypdf = "^7.1.0"
defusedxml = "^0.7.1"

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
codespell = "^2.4.3"
deptry = "^0.25.1"
diff-cover = "^10.6.0"
django-coverage-plugin = "^3.2.2"
django-stubs = "^6.0.5"
djlint = "^1.46.2"
import-linter = "^2.15"
mypy = "^2.2.0"
pip-audit = "^2.10.1"
pylint = "^4.0.3"
pytest = "^9.0.3"
pytest-cov = "^7.0.0"
pytest-django = "^4.14.0"
pytest-xdist = "^3.8.0"
ruff = "^0.17.0"
taplo = "^0.9.3"
tingle = "^0.9.0"
types-defusedxml = "^0.7.0.20260504"
vulture = "^2.16"

# BLACK

[tool.black]
line-length = 88
preview = true
skip-magic-trailing-comma = true
target-version = ['py314']

# CODESPELL

[tool.codespell]
skip = '*.lock'

# COVERAGE

[tool.coverage.run]
branch = true
# The template plugin needs the C tracer; Python 3.14 would default to sys.monitoring.
core = "ctrace"
source = ["src"]
omit = ["src/erudite/edges/*", "src/erudite/links/db/django/migrations/*"]
sigterm = true
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
exclude_also = ["raise NotImplementedError", "if TYPE_CHECKING:"]

[tool.coverage.django_coverage_plugin]
template_extensions = 'html'

# DEPTRY

[tool.deptry]
known_first_party = ["erudite"]

[tool.deptry.per_rule_ignores]
# Loaded by Django from settings strings, never imported by name.
DEP002 = ["django-unfold"]

# DJLINT

[tool.djlint]
profile = "django"
ignore = "H021,H031,H037,D018"

# MYPY

[tool.mypy]
check_untyped_defs = true
color_output = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
exclude = ["migrations/.*.py", "tests/.*.py"]
extra_checks = true
implicit_reexport = true
mypy_path = "src"
plugins = ["mypy_django_plugin.main"]
pretty = true
python_version = "3.14"
strict = true
strict_equality = true
strict_equality_for_none = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "erudite.edges.settings"

[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true

# The ORM, settings and the request cycle surface as Any; relaxed only where
# the framework is touched.
[[tool.mypy.overrides]]
module = [
    "erudite.edges.settings",
    "erudite.links.db.django.*",
    "erudite.gates.web.django.*",
]
disallow_any_expr = false

# PYLINT

[tool.pylint.main]
ignore = ["CVS", "migrations"]
load-plugins = [
    "pylint.extensions.bad_builtin",
    "pylint.extensions.broad_try_clause",
    "pylint.extensions.check_elif",
    "pylint.extensions.code_style",
    "pylint.extensions.comparison_placement",
    "pylint.extensions.confusing_elif",
    "pylint.extensions.consider_refactoring_into_while_condition",
    "pylint.extensions.consider_ternary_expression",
    "pylint.extensions.dict_init_mutate",
    "pylint.extensions.dunder",
    "pylint.extensions.empty_comment",
    "pylint.extensions.eq_without_hash",
    "pylint.extensions.for_any_all",
    "pylint.extensions.magic_value",
    "pylint.extensions.mccabe",
    "pylint.extensions.no_self_use",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.private_import",
    "pylint.extensions.redefined_loop_name",
    "pylint.extensions.redefined_variable_type",
    "pylint.extensions.set_membership",
    "pylint.extensions.typing",
]
py-version = "3.14"

[tool.pylint.design]
max-args = 12
max-positional-arguments = 2
max-public-methods = 12

[tool.pylint.format]
max-line-length = 88

[tool.pylint."messages control"]
disable = [
    "missing-docstring",
    "too-few-public-methods",
    "magic-value-comparison",
    "consider-using-namedtuple-or-dataclass",
    "no-member",
    "line-too-long",
]

[tool.pylint.reports]
output-format = "parseable"

# RUFF

[tool.ruff]
line-length = 88
output-format = 'concise'
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM",   # formatter owns commas
    "CPY",   # no per-file copyright headers
    "D1",    # no docstring on everything
    "DOC",   # no docstring param/return spec
    "FIX",   # TODO markers allowed
    "TD003", # no issue link required on TODO
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/**.py" = ["ANN", "ARG001", "E501", "RUF012"]
"tests/**.py" = [
    "ANN",
    "ARG002",
    "INP001",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "PLR6301",
    "S",
    "SLF001",
]

[tool.ruff.lint.pylint]
max-public-methods = 12
max-args = 12
max-positional-args = 2

[tool.ruff.lint.flake8-pytest-style]
parametrize-values-type = "tuple"

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# PYTEST

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "erudite.edges.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]

# IMPORT LINTER

[tool.importlinter]
include_external_packages = "True"
root_package = "erudite"

[[tool.importlinter.contracts]]
name = "gates"
type = "forbidden"
source_modules = ["erudite.gates"]
forbidden_modules = [
    "erudite.links",
    "erudite.inits",
    "erudite.mills",
    "erudite.specs",
    "erudite.edges",
]

[[tool.importlinter.contracts]]
name = "links"
type = "forbidden"
source_modules = ["erudite.links"]
forbidden_modules = [
    "erudite.gates",
    "erudite.inits",
    "erudite.mills",
    "erudite.specs",
    "erudite.edges",
]

[[tool.importlinter.contracts]]
name = "inits"
type = "forbidden"
source_modules = ["erudite.inits"]
forbidden_modules = ["erudite.specs", "erudite.edges"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "mills"
type = "forbidden"
source_modules = ["erudite.mills"]
forbidden_modules = [
    "erudite.gates",
    "erudite.links",
    "erudite.inits",
    "erudite.edges",
    "django",
]

[[tool.importlinter.contracts]]
name = "pacts"
type = "forbidden"
source_modules = ["erudite.pacts"]
forbidden_modules = [
    "erudite.gates",
    "erudite.links",
    "erudite.inits",
    "erudite.mills",
    "erudite.specs",
    "erudite.edges",
    "django",
]

[[tool.importlinter.contracts]]
name = "specs"
type = "forbidden"
source_modules = ["erudite.specs"]
forbidden_modules = [
    "erudite.gates",
    "erudite.links",
    "erudite.inits",
    "erudite.mills",
    "erudite.edges",
    "django",
]

[[tool.importlinter.contracts]]
name = "edges"
type = "forbidden"
source_modules = ["erudite.edges"]
forbidden_modules = [
    "erudite.gates",
    "erudite.links",
    "erudite.inits",
    "erudite.mills",
    "erudite.pacts",
    "erudite.specs",
]

[[tool.importlinter.contracts]]
name = "inside-gates"
type = "independence"
modules = ["erudite.gates.*"]

[[tool.importlinter.contracts]]
name = "inside-links"
type = "independence"
modules = ["erudite.links.*"]

[[tool.importlinter.contracts]]
name = "inside-edges"
type = "independence"
modules = ["erudite.edges.*"]

# VULTURE

[tool.vulture]
exclude = ["*/migrations/*.py", "*/erudite/edges/settings.py"]
ignore_names = [
    # Set by the middleware, read by views as request.services.
    "services",
    # Django
    "*Config",
    "*Middleware",
    "Command",
    "Meta",
    "application",
    "constraints",
    "help",
    "label",
    "name",
    "ordering",
    "urlpatterns",
    "verbose_name",
    "verbose_name_plural",
    # Django admin options, read by the admin site
    "autocomplete_fields",
    "extra",
    "fields",
    "inlines",
    "list_display",
    "list_filter",
    "model",
    "readonly_fields",
    "search_fields",
    # Book columns and write-dict keys, passed as a whole and not named in code
    "authors",
    "date_added",
    "date_read",
    "goodreads_id",
    "isbn10",
    "isbn13",
    "rating",
    "series_position",
]
ignore_decorators = ["@admin.register", "@override"]
sort_by_size = true
